<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="4小節のメロディーと7thコードを自動生成するピアノ練習アプリ" />
    <title>Daily Piano — ランダム譜面練習</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="hero">
        <div>
          <p class="eyebrow">PIANO PRACTICE GENERATOR</p>
          <h1>Daily Piano</h1>
          <p class="intro">偶然のフレーズから、今日の指づかいを見つけよう。</p>
        </div>
        <div class="time-signature" aria-label="4分の4拍子"><span>4</span><span>4</span></div>
      </header>

      <section class="control-panel" aria-label="練習設定">
        <button class="primary-button" id="generateButton" type="button">
          <span class="button-icon" aria-hidden="true">↻</span>
          新しい譜面をつくる
        </button>
        <div class="tempo-control">
          <label for="tempo">TEMPO</label>
          <input id="tempo" type="range" min="50" max="160" value="92" />
          <output id="tempoValue" for="tempo">92 BPM</output>
        </div>
        <button class="play-button" id="playButton" type="button">
          <span aria-hidden="true">▶</span><span id="playLabel">お手本を聴く</span>
        </button>
      </section>

      <section class="score-card" aria-labelledby="scoreTitle">
        <div class="score-heading">
          <div>
            <p class="section-number">EXERCISE <span id="exerciseNumber">01</span></p>
            <h2 id="scoreTitle">4 bars improvisation</h2>
          </div>
          <div class="score-meta"><span>4/4</span><span>8th notes</span><span>7th chords</span></div>
        </div>
        <div class="score-scroll" id="scoreScroll">
          <svg id="score" viewBox="0 0 1160 330" role="img" aria-label="自動生成された4小節のピアノ楽譜"></svg>
        </div>
        <div class="play-progress" aria-hidden="true"><span id="progressBar"></span></div>
        <div class="legend">
          <span><i class="dot melody-dot"></i>メロディー</span>
          <span><i class="dot harmony-dot"></i>コード構成音</span>
          <span>各コードは 1拍ごとに変化します</span>
        </div>
      </section>

      <p class="hint"><kbd>Space</kbd> で再生・停止　 <kbd>R</kbd> で新しい譜面</p>
    </main>
    <script src="app.js"></script>
  </body>
</html>
